[project]
name = "nhlpred"
version = "0.1.0"
description = "Daily NHL win-probability model with a public track record"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "requests>=2.32",
  "psycopg[binary]>=3.2",
  "huggingface_hub>=0.25",
  "joblib>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nhlpred"]
