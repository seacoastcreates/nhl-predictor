name: daily-predictions

on:
  schedule:
    # Hourly, off the top of the hour. GitHub starts scheduled runs late (5 to 8
    # hours on day one), so a few fixed times cannot promise a run before puck
    # drop. Hourly means each game has many earlier attempts, including for
    # afternoon starts. The job is idempotent and takes under a minute.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline pytest
      - name: Download data and run tests
        run: |
          python -c "from nhlpred import data; data.download()"
          pytest -q pipeline/tests
      - name: Settle, retrain, predict
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m nhlpred.daily --no-download
      - name: Publish model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVENT: ${{ github.event_name }}
        # once a day (the 15:00 UTC hour), or on a manual run
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$(date -u +%H)" = 15 ]; then python -m nhlpred.publish; fi
      - name: Refresh the site's cached page
        if: always()
        run: |
          curl -fsS -o /dev/null https://nhl.36dunes.com || true
          sleep 20
          curl -fsS -o /dev/null https://nhl.36dunes.com || true
